name: Run Journey Tests on GitHub

permissions:
  checks: write
  pull-requests: write
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [run-tests]

jobs:
  build:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    env:
      # Run spec files in parallel (4 workers). The livestock quartet is grouped
      # into one worker in wdio.conf.js, so it stays sequential within that group.
      USE_INSTANCES: "4"
      # The wdio-tests image is built by the buildx step below, so the test
      # script skips its own build.
      SKIP_IMAGE_BUILD: "true"
      MESSAGE_QUEUE_HOST: ${{ secrets.MESSAGE_QUEUE_HOST }}
      EVENT_QUEUE_ADDRESS: ${{ secrets.EVENT_QUEUE_ADDRESS }}
      MESSAGE_QUEUE_USER: ${{ secrets.MESSAGE_QUEUE_USER }}
      FCP_AHWR_EVENT_QUEUE_SA_KEY: ${{ secrets.FCP_AHWR_EVENT_QUEUE_SA_KEY }}
      AADAR_AUTHORITY_URL: ${{ secrets.AADAR_AUTHORITY_URL }}
      AADAR_CLIENT_SECRET: ${{ secrets.AADAR_CLIENT_SECRET }}
      AADAR_CLIENT_ID: ${{ secrets.AADAR_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wdio-tests image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wdio-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test script
        run: ./scripts/github_run_tests.sh

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: logs/

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/
