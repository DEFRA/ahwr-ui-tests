name: Cache infra Docker images
description: >-
  Restore the pinned infra images (localstack, mongo, redis) from the GitHub
  cache so docker compose reuses them instead of pulling from Docker Hub. The
  key depends only on docker-compose.yml, so it is unaffected by app-image churn.

runs:
  using: composite
  steps:
    - name: Restore infra image cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.infra-image-cache/infra.tar
        key: docker-infra-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}

    - name: Load cached infra images
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: ./scripts/infra_image_cache.sh load ~/.infra-image-cache/infra.tar

    - name: Pull and cache infra images
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/infra_image_cache.sh save ~/.infra-image-cache/infra.tar
